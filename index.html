<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI Payment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-primary': '#00d1b2',
              'brand-secondary': '#3273dc',
              'dark-bg': '#1a202c',
              'dark-card': '#2d3748',
              'dark-text': '#e2e8f0',
              'light-bg': '#f7fafc',
              'light-card': '#ffffff',
              'light-text': '#2d3748',
            },
            boxShadow: {
              'neon-green': '0 0 5px #34d399, 0 0 10px #34d399, 0 0 15px #34d399',
              'neon-blue': '0 0 5px #60a5fa, 0 0 10px #60a5fa, 0 0 15px #60a5fa',
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'progress': {
                '0%': { width: '0%' },
                '100%': { width: '100%' },
              }
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'progress': 'progress 1.5s ease-in-out forwards',
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js",
    "firebase/analytics": "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.3.0/"
  }
}
</script>
</head>
  <body class="bg-light-bg dark:bg-dark-bg">
    <div id="root"></div>
  </body>
</html>
